name: CI

on:
  pull_request:
  push:
    branches:
      - flutterflow

jobs:
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check font asset budget
        run: |
          actual_mb="$(du -sm assets/fonts | cut -f1)"
          echo "assets/fonts size: ${actual_mb} MB"
          test "${actual_mb}" -le 10
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Unit test functions logic
        run: npm run test:functions
      - name: Load functions source
        run: node -e "require('./index.js')"

  custom-functions:
    name: Firebase Custom Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/custom_cloud_functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/custom_cloud_functions/package-lock.json
      - name: Install Node dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Unit test custom functions logic
        run: npm run test:functions
      - name: Load custom functions source
        run: node -e "require('./index.js')"

  firebase-rules:
    name: Firebase Rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Node dependencies
        working-directory: firebase/functions
        run: npm ci
      - name: Validate Firestore rules load in emulator
        run: npx --yes firebase-tools@latest emulators:exec --project demo-roast --only firestore "npm --prefix functions run test:rules"
